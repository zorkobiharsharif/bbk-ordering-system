<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Redirecting…</title>
<script src="../js/base-path.js"></script>
</head>
<body>
<!-- Owner and staff now share one sign-in page. No <meta http-equiv="refresh">
     fallback here — it can only ever point to a hardcoded path, which is
     exactly what breaks on GitHub Pages' /<repo-name>/ prefix. The JS
     redirect is base-path aware and fires immediately; this admin tool
     already requires JS for everything else, so a no-JS fallback wasn't
     adding real coverage. External file, not an inline <script> — Vercel's
     CSP (script-src 'self' ...) has no 'unsafe-inline', so an inline
     script here is silently blocked and staff get stuck on this page
     forever with no visible error. -->
<p>Redirecting to <a data-owner-link href="/owner/">the sign-in page</a>…</p>
<!-- "../staff/redirect.js", not "redirect.js" — Vercel's /staff rewrite
     serves this file's content without adding a trailing slash to the
     address bar, so the browser treats "/staff" as a file at the domain
     root and resolves a bare relative src against that root instead of
     this folder. Going up first and back down into "staff/" by name
     self-corrects on both Vercel (the ".." is a no-op at the root) and
     GitHub Pages (a real one-level ascend from .../staff/), the same
     pattern base-path.js's own script tag already relies on above. -->
<script src="../staff/redirect.js"></script>
</body>
</html>
